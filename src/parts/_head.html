<!-- shared SVG definitions: use marker-end="url(#arw)" or "url(#arw-cyan)", fill="url(#g-brand)", filter="url(#glow)" -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#879497"/></marker>
    <marker id="arw-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#02EFF0"/></marker>
    <marker id="arw-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7A6B"/></marker>
    <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F282F"/><stop offset="1" stop-color="#02EFF0"/></linearGradient>
    <linearGradient id="g-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#02EFF0"/><stop offset="1" stop-color="#81F7F7"/></linearGradient>
    <radialGradient id="g-orb" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#C0FBFB"/><stop offset=".45" stop-color="#02EFF0"/><stop offset="1" stop-color="#017E7F"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>
